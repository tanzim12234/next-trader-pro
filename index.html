<script>
"use strict";

const $ = id => document.getElementById(id);

let stream = null;
let candlePollTimer = null;
let candlePollBusy = false;
let candles = [];
let latestMarketData = null;

let shareStream = null;
let analysisBusy = false;
let voiceEnabled = true;
let lastVoiceKey = "";

function setText(id, value) {
  const el = $(id);
  if (el) {
    el.textContent =
      value === null || value === undefined || value === ""
        ? "—"
        : String(value);
  }
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function fmt(value) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }

  const n = Number(value);

  return Number.isFinite(n)
    ? n.toFixed(5).replace(/0+$/, "").replace(/\.$/, "")
    : String(value);
}

function setMarketStatus(text, mode = "") {
  setText("marketStatus", text);
  setText("topStatus", text);

  if ($("marketDot")) {
    $("marketDot").className = "dot" + (mode ? " " + mode : "");
  }

  if ($("topDot")) {
    $("topDot").className = "dot" + (mode ? " " + mode : "");
  }
}

function selectedSymbol() {
  return $("symbol").value.trim();
}

function selectedTF() {
  return Number($("tf").value || 60);
}

function setSettings() {
  return {
    market: $("marketType").value,
    timeframe:
      $("tf").selectedOptions[0]?.textContent || "1 minute",
    mode: $("analysisMode").value,
    min_confidence: Number($("minConfidence").value),
    signal_filter: $("signalFilter").value
  };
}

/* =========================
   LOGIN
========================= */

async function login() {
  setText("loginStatus", "Authenticating…");

  try {
    const response = await fetch("/api/auth", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        password: $("password").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Authentication failed");
    }

    sessionStorage.setItem("nt_unlocked", "1");
    $("login").classList.add("hidden");

  } catch (error) {
    setText(
      "loginStatus",
      error.message || "Unable to log in"
    );
  }
}

$("loginBtn").addEventListener("click", login);

$("password").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    login();
  }
});

if (sessionStorage.getItem("nt_unlocked") === "1") {
  $("login").classList.add("hidden");
}

/* =========================
   MARKET UI
========================= */

function updateMarketUI(data) {
  const price = data.price ?? data.close;
  const symbol = data.symbol || data.asset || selectedSymbol();

  setText("heroSymbol", symbol);
  setText("statSymbol", symbol);
  setText("heroPrice", fmt(price));

  setText("open", fmt(data.open));
  setText("high", fmt(data.high));
  setText("low", fmt(data.low));
  setText("close", fmt(data.close ?? price));

  setText(
    "statTf",
    $("tf").selectedOptions[0]?.textContent.toUpperCase()
  );

  setText("statBars", candles.length);
  setText(
    "statUpdated",
    new Date().toLocaleTimeString("en-GB")
  );

  latestMarketData = {
    asset: symbol,
    symbol,
    price: price ?? null,
    open: data.open ?? null,
    high: data.high ?? null,
    low: data.low ?? null,
    close: data.close ?? price ?? null,
    time: data.time ?? data.server_time ?? null,
    source: "OTCHARTS"
  };

  drawChart();
}

function addFeedRow(data) {
  const row = document.createElement("div");
  row.className = "feed-row";

  [
    data.symbol || selectedSymbol(),
    data.type || "MARKET DATA",
    fmt(data.price ?? data.close)
  ].forEach(value => {
    const span = document.createElement("span");
    span.textContent = String(value);
    row.appendChild(span);
  });

  $("feed").prepend(row);

  while ($("feed").children.length > 20) {
    $("feed").lastElementChild.remove();
  }
}

/* =========================
   CANDLE CHART
========================= */

function drawChart() {
  const canvas = $("marketChart");
  if (!canvas) return;

  const rect = canvas.getBoundingClientRect();

  if (!rect.width || !rect.height) return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const width = Math.floor(rect.width * dpr);
  const height = Math.floor(rect.height * dpr);

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }

  const ctx = canvas.getContext("2d");

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = "#050a14";
  ctx.fillRect(0, 0, w, h);

  const list = candles.slice(-55);

  if (!list.length) {
    ctx.fillStyle = "#8292b1";
    ctx.font = "12px sans-serif";
    ctx.fillText("Connect to load candle data", 18, 28);
    return;
  }

  const pad = {
    top: 16,
    right: 62,
    bottom: 18,
    left: 8
  };

  const chartW = w - pad.left - pad.right;
  const chartH = h - pad.top - pad.bottom;

  const prices = list
    .flatMap(c => [Number(c.high), Number(c.low)])
    .filter(Number.isFinite);

  if (!prices.length) return;

  let min = Math.min(...prices);
  let max = Math.max(...prices);

  if (min === max) {
    min -= 0.0001;
    max += 0.0001;
  }

  const margin = (max - min) * 0.08;

  min -= margin;
  max += margin;

  const y = price =>
    pad.top + ((max - price) / (max - min)) * chartH;

  ctx.font = "10px ui-monospace, monospace";
  ctx.fillStyle = "#8190ad";
  ctx.strokeStyle = "#26324a";
  ctx.lineWidth = 1;

  /* Horizontal price grid */

  for (let i = 0; i <= 4; i++) {
    const py = pad.top + chartH * i / 4;
    const price = max - (max - min) * i / 4;

    ctx.beginPath();
    ctx.moveTo(pad.left, py);
    ctx.lineTo(w - pad.right, py);
    ctx.stroke();

    ctx.fillText(
      price.toFixed(5),
      w - pad.right + 6,
      py + 3
    );
  }

  const step = chartW / list.length;
  const bodyW = Math.max(2, Math.min(11, step * 0.58));

  /* Candles */

  list.forEach((c, i) => {
    const o = Number(c.open);
    const hi = Number(c.high);
    const lo = Number(c.low);
    const cl = Number(c.close);

    if (![o, hi, lo, cl].every(Number.isFinite)) {
      return;
    }

    const x = pad.left + step * (i + 0.5);
    const color = cl >= o ? "#37e8a4" : "#ff527c";

    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 1.2;

    /* Wick */

    ctx.beginPath();
    ctx.moveTo(x, y(hi));
    ctx.lineTo(x, y(lo));
    ctx.stroke();

    /* Body */

    const top = Math.min(y(o), y(cl));
    const bodyH = Math.max(1.5, Math.abs(y(o) - y(cl)));

    ctx.fillRect(
      x - bodyW / 2,
      top,
      bodyW,
      bodyH
    );
  });

  /* Latest price line */

  const last = list[list.length - 1];
  const price = Number(last.close);

  if (Number.isFinite(price)) {
    ctx.strokeStyle = "#46f3ff";
    ctx.setLineDash([4, 4]);

    ctx.beginPath();
    ctx.moveTo(pad.left, y(price));
    ctx.lineTo(w - pad.right, y(price));
    ctx.stroke();

    ctx.setLineDash([]);
  }
}

/* =========================
   LOAD HISTORICAL CANDLES
========================= */

async function loadCandles() {
  const symbol = selectedSymbol();

  if (!symbol) {
    throw new Error("Enter a symbol first.");
  }

  const url = new URL("/api/otcharts", location.origin);

  url.searchParams.set("mode", "candles");
  url.searchParams.set("symbol", symbol);
  url.searchParams.set("tf", String(selectedTF()));
  url.searchParams.set("limit", "55");

  const response = await fetch(url.toString(), {
    credentials: "same-origin",
    cache: "no-store"
  });

  const data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || "Candle request failed");
  }

  if (!Array.isArray(data.candles)) {
    throw new Error("Invalid candle response");
  }

  candles = data.candles.map(c => ({ ...c }));

  setText(
    "chartInfo",
    `${candles.length} candles · ${symbol}`
  );

  setText("statBars", candles.length);

  const last = candles[candles.length - 1];

  if (last) {
    updateMarketUI({
      ...last,
      symbol: data.symbol || symbol,
      price: last.close
    });
  } else {
    drawChart();
  }

  return data;
}

/* =========================
   LIVE TICK PROCESSING
========================= */

function updateCandleFromTick(tick) {
  /*
   * Accept common price field names.
   */

  const price = Number(
    tick.price ??
    tick.close ??
    tick.value
  );

  if (!Number.isFinite(price)) {
    console.warn("Tick has no valid price:", tick);
    return;
  }

  /*
   * Accept seconds or milliseconds.
   */

  let time = Number(
    tick.time ??
    tick.timestamp ??
    tick.server_time
  );

  if (!Number.isFinite(time)) {
    time = Date.now() / 1000;
  } else if (time > 1e12) {
    time = time / 1000;
  }

  const tf = selectedTF();
  const bucket = Math.floor(time / tf) * tf;

  let current = candles[candles.length - 1];

  /*
   * Start a new candle when the timeframe changes.
   */

  if (!current || Number(current.time) !== bucket) {
    current = {
      time: bucket,
      open: price,
      high: price,
      low: price,
      close: price
    };

    candles.push(current);

  } else {
    current.high = Math.max(Number(current.high), price);
    current.low = Math.min(Number(current.low), price);
    current.close = price;
  }

  if (candles.length > 150) {
    candles.shift();
  }

  updateMarketUI({
    ...current,
    symbol: tick.symbol || tick.asset || selectedSymbol(),
    price,
    time,
    type: "LIVE TICK"
  });

  addFeedRow({
    symbol: tick.symbol || selectedSymbol(),
    price,
    type: "LIVE TICK"
  });

  setMarketStatus("LIVE", "on");

  setText("marketMessage", "Receiving live market updates.");
  setText("heroFeedStatus", "Live ticks received");
}

/* =========================
   POLLING FALLBACK
========================= */

/*
 * If the SSE connection opens but does not deliver tick events,
 * periodically reload candles from the API.
 *
 * This fallback can update the chart only when the API returns
 * updated candle data. It cannot manufacture real market ticks.
 */

function startCandlePolling(source) {
  stopCandlePolling();

  candlePollTimer = setInterval(async () => {
    if (
      candlePollBusy ||
      !stream ||
      stream !== source
    ) {
      return;
    }

    candlePollBusy = true;

    try {
      await loadCandles();

      setText(
        "marketMessage",
        "Connection open. Candle data refreshed from the API."
      );

    } catch (error) {
      console.error("Candle refresh failed:", error);

      setText(
        "marketMessage",
        "Candle refresh failed: " + error.message
      );

    } finally {
      candlePollBusy = false;
    }
  }, 4000);
}

function stopCandlePolling() {
  if (candlePollTimer) {
    clearInterval(candlePollTimer);
    candlePollTimer = null;
  }

  candlePollBusy = false;
}

/* =========================
   DISCONNECT LIVE
========================= */

function disconnectLive(
  message = "Disconnected."
) {
  stopCandlePolling();

  if (stream) {
    stream.close();
    stream = null;
  }

  $("connectBtn").textContent = "CONNECT LIVE";

  setMarketStatus("OFFLINE");

  setText("marketMessage", message);
  setText("heroFeedStatus", "Waiting for connection");
}

/* =========================
   CONNECT LIVE
========================= */

async function connectLive() {
  if (stream) {
    disconnectLive();
    return;
  }

  const symbol = selectedSymbol();

  if (!symbol) {
    setText("marketMessage", "Enter a trading symbol.");
    return;
  }

  $("connectBtn").disabled = true;
  $("connectBtn").textContent = "CONNECTING…";

  setMarketStatus("LOADING", "warn");

  setText(
    "marketMessage",
    "Loading historical candles…"
  );

  try {
    await loadCandles();

    const url = new URL("/api/otcharts", location.origin);

    url.searchParams.set("mode", "stream");
    url.searchParams.set("symbol", symbol);

    const source = new EventSource(url.toString());

    stream = source;

    /*
     * EventSource connection opened.
     */

    source.onopen = () => {
      if (stream !== source) return;

      setMarketStatus("CONNECTED", "on");

      $("connectBtn").textContent = "DISCONNECT LIVE";

      setText("heroFeedStatus", "Stream connected");

      setText(
        "marketMessage",
        "Stream is open. Waiting for live tick events."
      );

      startCandlePolling(source);
    };

    /*
     * Optional named connected event.
     */

    source.addEventListener("connected", event => {
      if (stream !== source) return;

      setMarketStatus("LIVE", "on");

      $("connectBtn").textContent = "DISCONNECT LIVE";

      setText("heroFeedStatus", "Connected");

      setText(
        "marketMessage",
        "Live stream connected. Waiting for ticks."
      );

      console.log("Stream connected:", event.data);
    });

    /*
     * Live tick event.
     */

    source.addEventListener("tick", event => {
      if (stream !== source) return;

      try {
        const tick = JSON.parse(event.data);

        updateCandleFromTick(tick);

      } catch (error) {
        console.error("Tick parse error:", error, event.data);
      }
    });

    /*
     * Default message event.
     * Some SSE servers send data without `event: tick`.
     */

    source.onmessage = event => {
      if (stream !== source) return;

      try {
        const payload = JSON.parse(event.data);

        if (
          payload.price !== undefined ||
          payload.close !== undefined ||
          payload.value !== undefined
        ) {
          updateCandleFromTick(payload);
        }

      } catch (error) {
        console.warn(
          "Ignoring non-JSON stream message:",
          event.data
        );
      }
    };

    /*
     * Connection error / automatic reconnection.
     */

    source.onerror = () => {
      if (stream !== source) return;

      setMarketStatus("RECONNECTING", "warn");

      setText(
        "marketMessage",
        "Stream connection interrupted. Browser may retry automatically."
      );

      setText("heroFeedStatus", "Reconnecting…");
    };

  } catch (error) {
    disconnectLive(error.message || "Unable to connect.");

    setMarketStatus("ERROR", "warn");

    console.error("Live connection error:", error);

  } finally {
    $("connectBtn").disabled = false;

    if (!stream) {
      $("connectBtn").textContent = "CONNECT LIVE";
    }
  }
}

$("connectBtn").addEventListener("click", connectLive);

/* =========================
   SYMBOL / TIMEFRAME CHANGE
========================= */

async function reloadMarketSettings() {
  const wasConnected = Boolean(stream);

  if (stream) {
    disconnectLive("Reloading market settings…");
  }

  candles = [];

  drawChart();

  try {
    await loadCandles();

    if (wasConnected) {
      await connectLive();
    }

  } catch (error) {
    console.error(error);

    setText(
      "marketMessage",
      error.message || "Unable to reload market data."
    );
  }
}

$("tf").addEventListener("change", reloadMarketSettings);
$("symbol").addEventListener("change", reloadMarketSettings);

window.addEventListener("resize", drawChart);

/* =========================
   CLOCK / CANDLE COUNTDOWN
========================= */

function clockTick() {
  const now = new Date();

  const time = now.toLocaleTimeString("en-GB", {
    hour12: false
  });

  setText("clock", time);
  setText("localTime", time);

  const tf = selectedTF();
  const epoch = Math.floor(Date.now() / 1000);
  const remain = tf - (epoch % tf);

  const mm = String(Math.floor(remain / 60)).padStart(2, "0");
  const ss = String(remain % 60).padStart(2, "0");

  setText("countdown", `${mm}:${ss}`);
}

setInterval(clockTick, 1000);
clockTick();

/* =========================
   IMAGE UPLOAD PREVIEW
========================= */

$("chartFile").addEventListener("change", () => {
  const file = $("chartFile").files[0];

  if (!file) return;

  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) {
    setText(
      "analysisStatus",
      "Use a PNG, JPEG or WebP image."
    );

    return;
  }

  const url = URL.createObjectURL(file);

  $("preview").src = url;
  $("preview").style.display = "block";
});

/* =========================
   IMAGE RESIZE
========================= */

function resizeImage(file) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    const url = URL.createObjectURL(file);

    image.onload = () => {
      const scale = Math.min(1, 1200 / image.width);

      const canvas = document.createElement("canvas");

      canvas.width = Math.round(image.width * scale);
      canvas.height = Math.round(image.height * scale);

      canvas
        .getContext("2d")
        .drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

      URL.revokeObjectURL(url);

      resolve(canvas.toDataURL("image/jpeg", 0.76));
    };

    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Unable to read image."));
    };

    image.src = url;
  });
}

/* =========================
   AI ANALYSIS
========================= */

async function analyzeImage(image, sourceName) {
  if (analysisBusy) return;

  analysisBusy = true;

  $("analyzeBtn").disabled = true;

  setText(
    "analysisStatus",
    `Analyzing ${sourceName}…`
  );

  $("result").classList.remove("hidden");
  $("result").textContent = "AI analysis in progress…";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image,
        settings: setSettings(),
        live_data: latestMarketData || undefined
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || `Analysis failed (${response.status})`
      );
    }

    renderResult(data, sourceName);

    setText("analysisStatus", "Analysis complete.");

    return data;

  } catch (error) {
    $("result").textContent =
      error.message || "Analysis failed.";

    setText("analysisStatus", "Analysis error.");

  } finally {
    analysisBusy = false;
    $("analyzeBtn").disabled = false;
  }
}

$("analyzeBtn").addEventListener("click", async () => {
  const file = $("chartFile").files[0];

  if (!file) {
    setText(
      "analysisStatus",
      "Upload a chart screenshot first."
    );

    return;
  }

  try {
    const image = await resizeImage(file);

    await analyzeImage(image, "Screenshot");

  } catch (error) {
    setText("analysisStatus", error.message);
  }
});

/* =========================
   ANALYSIS RESULT
========================= */

function renderResult(data, sourceName) {
  const signal = String(
    data.signal || "NO TRADE"
  ).toUpperCase();

  const cls =
    signal === "CALL"
      ? "call"
      : signal === "PUT"
        ? "put"
        : "no";

  const reasons = Array.isArray(data.reasons)
    ? data.reasons
        .map(reason => `<li>${escapeHTML(reason)}</li>`)
        .join("")
    : "<li>No detailed reasons returned.</li>";

  $("result").innerHTML = `
    <div class="eyebrow">
      ${escapeHTML(sourceName)} ANALYSIS
    </div>

    <div class="signal ${cls}">
      ${escapeHTML(signal)}
    </div>

    <div class="result-grid">
      <div class="result-mini">
        <span>CONFIDENCE</span>
        <b>${escapeHTML(data.confidence ?? "—")}%</b>
      </div>

      <div class="result-mini">
        <span>TREND</span>
        <b>${escapeHTML(data.trend || "—")}</b>
      </div>

      <div class="result-mini">
        <span>EXPIRY</span>
        <b>${escapeHTML(data.expiry || "—")}</b>
      </div>

      <div class="result-mini">
        <span>ENTRY</span>
        <b>${escapeHTML(data.entry_candle || "WAIT")}</b>
      </div>
    </div>

    <p>
      <b>Setup</b><br>
      ${escapeHTML(data.setup || "—")}
    </p>

    <b>Reasons</b>

    <ul class="reason-list">
      ${reasons}
    </ul>

    <p class="small">
      ${escapeHTML(
        data.disclaimer ||
        "Technical analysis is probabilistic. No signal is guaranteed."
      )}
    </p>
  `;

  speakSignal(signal, sourceName);
}

/* =========================
   VOICE
========================= */

function speakSignal(signal, context) {
  if (!voiceEnabled || !("speechSynthesis" in window)) {
    return;
  }

  const key = `${context}|${signal}`;

  if (key === lastVoiceKey) return;

  lastVoiceKey = key;

  const text =
    signal === "CALL"
      ? "Call"
      : signal === "PUT"
        ? "Put"
        : "No trade";

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.rate = 1;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);
}

$("voiceBtn").addEventListener("click", () => {
  voiceEnabled = !voiceEnabled;

  $("voiceBtn").textContent =
    voiceEnabled ? "VOICE: ON" : "VOICE: OFF";

  if (!voiceEnabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
});

/* =========================
   SCREEN SHARE
========================= */

async function startScreenShare() {
  if (!navigator.mediaDevices?.getDisplayMedia) {
    setText(
      "shareStatus",
      "Screen sharing is not supported in this browser."
    );

    return;
  }

  try {
    shareStream = await navigator.mediaDevices.getDisplayMedia({
      video: {
        frameRate: {
          ideal: 5,
          max: 10
        }
      },
      audio: false
    });

    $("shareVideo").srcObject = shareStream;
    $("shareVideo").style.display = "block";

    $("captureShare").disabled = false;
    $("stopShare").disabled = false;
    $("startShare").disabled = true;

    setText(
      "shareStatus",
      "Screen share active. Capture when your chart is clear."
    );

    const track = shareStream.getVideoTracks()[0];

    if (track) {
      track.addEventListener("ended", stopScreenShare);
    }

  } catch (error) {
    setText(
      "shareStatus",
      "Screen share cancelled or unavailable."
    );
  }
}

function captureScreenFrame() {
  const video = $("shareVideo");

  if (!video.videoWidth || !video.videoHeight) {
    throw new Error("Screen frame is not ready yet.");
  }

  const scale = Math.min(1, 1200 / video.videoWidth);

  const canvas = document.createElement("canvas");

  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);

  canvas
    .getContext("2d")
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  return canvas.toDataURL("image/jpeg", 0.76);
}

async function analyzeSharedScreen() {
  try {
    setText("shareStatus", "Capturing screen…");

    const image = captureScreenFrame();

    await analyzeImage(image, "Shared screen");

  } catch (error) {
    setText("shareStatus", error.message);
  }
}

function stopScreenShare() {
  if (shareStream) {
    shareStream.getTracks().forEach(track => track.stop());
    shareStream = null;
  }

  $("shareVideo").srcObject = null;
  $("shareVideo").style.display = "none";

  $("captureShare").disabled = true;
  $("stopShare").disabled = true;
  $("startShare").disabled = false;

  setText("shareStatus", "Screen share stopped.");
}

$("startShare").addEventListener("click", startScreenShare);
$("captureShare").addEventListener("click", analyzeSharedScreen);
$("stopShare").addEventListener("click", stopScreenShare);

/* =========================
   CLEANUP
========================= */

window.addEventListener("beforeunload", () => {
  stopCandlePolling();

  if (stream) {
    stream.close();
  }

  if (shareStream) {
    shareStream.getTracks().forEach(track => track.stop());
  }
});

drawChart();
</script>
