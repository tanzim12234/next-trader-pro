<script>
const file = document.getElementById('file');
const preview = document.getElementById('preview');

file.onchange = () => {
  if (file.files[0]) {
    preview.src = URL.createObjectURL(file.files[0]);
    preview.style.display = 'block';
  }
};

document.getElementById('go').onclick = async () => {
  const f = file.files[0];
  const status = document.getElementById('status');
  const box = document.getElementById('result');

  if (!f) {
    status.textContent = 'Upload a chart screenshot first.';
    return;
  }

  status.textContent = 'Analyzing screenshot…';
  box.style.display = 'none';

  try {
    // Resize image before sending
    const img = new Image();
    img.src = URL.createObjectURL(f);

    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
    });

    const maxWidth = 1600;
    const scale = Math.min(1, maxWidth / img.width);

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);

    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    // Convert to compressed JPEG
    const image = canvas.toDataURL('image/jpeg', 0.80);

    const r = await fetch('/api/analyze', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        image: image
      })
    });

    const x = await r.json();

    if (!r.ok) {
      status.textContent = x.error || `Server error (${r.status})`;
      console.error(x);
      return;
    }

    if (x.error) {
      status.textContent = x.error;
      return;
    }

    status.textContent = '';
    box.style.display = 'block';

    box.innerHTML = `
      <div class="signal">${x.signal || 'NO TRADE'}</div>

      <div class="row">
        <span class="pill">
          Confidence: ${x.confidence ?? '—'}%
        </span>

        <span class="pill">
          Trend: ${x.trend || '—'}
        </span>

        <span class="pill">
          Expiry: ${x.expiry || '—'}
        </span>

        <span class="pill">
          Risk: ${x.risk || '—'}
        </span>
      </div>

      <p>
        <b>Setup:</b> ${x.setup || '—'}
      </p>

      <b>Reasons</b>

      <ul>
        ${(x.reasons || []).map(a => `<li>${a}</li>`).join('')}
      </ul>

      <p class="muted">
        ${x.disclaimer || 'Analysis is uncertain and not financial advice.'}
      </p>
    `;

  } catch (e) {
    console.error(e);
    status.textContent =
      'Request failed. Check Vercel API logs.';
  }
};
</script>
