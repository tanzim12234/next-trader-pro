<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXT TRADER AI</title>
<style>
body{margin:0;background:#0b1020;color:#eef2ff;font-family:Inter,Arial,sans-serif}
.wrap{max-width:720px;margin:auto;padding:28px 18px}
h1{margin:0;font-size:30px}.sub{color:#9ca8c7;margin:8px 0 22px}
.card{background:#131a2d;border:1px solid #26304a;border-radius:18px;padding:18px;margin:14px 0}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;background:#0d1425;color:white;border:1px dashed #465273}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer}
#preview{max-width:100%;max-height:360px;display:none;margin-top:14px;border-radius:12px}
.signal{font-size:34px;font-weight:900}.muted{color:#a9b3cc}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:8px 12px;border-radius:999px;background:#202a43}
ul{padding-left:20px}
</style></head>
<body><div class="wrap">
<h1>⚡ NEXT TRADER AI</h1><div class="sub">Screenshot-based chart analysis • CALL / PUT / NO TRADE</div>
<div class="card">
<input id="file" type="file" accept="image/*">
<img id="preview">
<button id="go">ANALYZE CHART</button>
<div id="status" class="muted"></div>
</div>
<div id="result" class="card" style="display:none"></div>
</div>
<script>
const file=document.getElementById('file'), preview=document.getElementById('preview');
file.onchange=()=>{if(file.files[0]){preview.src=URL.createObjectURL(file.files[0]);preview.style.display='block'}};
document.getElementById('go').onclick=async()=>{
 const f=file.files[0], status=document.getElementById('status'), box=document.getElementById('result');
 if(!f){status.textContent='Upload a chart screenshot first.';return}
 status.textContent='Analyzing screenshot…'; box.style.display='none';
 const fd=new FormData();fd.append('file',f);
 try{
  const r=await fetch('/analyze',{method:'POST',body:fd}); const x=await r.json();
  if(x.error){status.textContent=x.error;return}
  status.textContent='';
  box.style.display='block';
  box.innerHTML=`<div class="signal">${x.signal||'NO TRADE'}</div>
  <div class="row"><span class="pill">Confidence: ${x.confidence??'—'}%</span>
  <span class="pill">Trend: ${x.trend||'—'}</span><span class="pill">Expiry: ${x.expiry||'—'}</span>
  <span class="pill">Risk: ${x.risk||'—'}</span></div>
  <p><b>Setup:</b> ${x.setup||'—'}</p>
  <b>Reasons</b><ul>${(x.reasons||[]).map(a=>`<li>${a}</li>`).join('')}</ul>
  <p class="muted">${x.disclaimer||'Analysis is uncertain and not financial advice.'}</p>`;
 }catch(e){status.textContent='Server error. Check that the backend is running.'}
};
</script></body></html>
