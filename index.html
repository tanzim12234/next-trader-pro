<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXT TRADER AI</title>

<style>
body{
  margin:0;
  background:#0b1020;
  color:#eef2ff;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:720px;
  margin:auto;
  padding:28px 18px;
}
h1{margin:0;font-size:30px}
.sub{color:#9ca8c7;margin:8px 0 22px}
.card{
  background:#131a2d;
  border:1px solid #26304a;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
}
input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border-radius:12px;
  background:#0d1425;
  color:white;
  border:1px dashed #465273;
}
button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:12px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
}
#preview{
  max-width:100%;
  max-height:360px;
  display:none;
  margin-top:14px;
  border-radius:12px;
}
.signal{
  font-size:34px;
  font-weight:900;
}
.muted{color:#a9b3cc}
.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.pill{
  padding:8px 12px;
  border-radius:999px;
  background:#202a43;
}
ul{padding-left:20px}
</style>
</head>

<body>

<div class="wrap">

<h1>⚡ NEXT TRADER AI</h1>

<div class="sub">
Screenshot-based chart analysis • CALL / PUT / NO TRADE
</div>

<div class="card">

<input id="file" type="file" accept="image/png,image/jpeg,image/webp">

<img id="preview">

<button id="go">ANALYZE CHART</button>

<div id="status" class="muted"></div>

</div>

<div id="result" class="card" style="display:none"></div>

</div>

<script>

const file = document.getElementById("file");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const box = document.getElementById("result");

file.addEventListener("change", () => {

  const f = file.files[0];

  if (!f) return;

  preview.src = URL.createObjectURL(f);
  preview.style.display = "block";

});

document.getElementById("go").addEventListener("click", async () => {

  const f = file.files[0];

  if (!f) {
    status.textContent = "Upload a chart screenshot first.";
    return;
  }

  status.textContent = "Analyzing screenshot...";
  box.style.display = "none";

  try {

    const image = await resizeImage(f);

    console.log("Sending image to /api/analyze");

    const response = await fetch("/api/analyze", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        image: image
      })

    });

    const data = await response.json();

    console.log("API response:", data);

    if (!response.ok) {

      status.textContent =
        data.error || "API error: " + response.status;

      return;
    }

    if (data.error) {

      status.textContent = data.error;

      return;
    }

    status.textContent = "";

    box.style.display = "block";

    box.innerHTML = `

      <div class="signal">
        ${data.signal || "NO TRADE"}
      </div>

      <div class="row">

        <span class="pill">
          Confidence: ${data.confidence ?? "—"}%
        </span>

        <span class="pill">
          Trend: ${data.trend || "—"}
        </span>

        <span class="pill">
          Expiry: ${data.expiry || "—"}
        </span>

        <span class="pill">
          Risk: ${data.risk || "—"}
        </span>

      </div>

      <p>
        <b>Setup:</b>
        ${data.setup || "—"}
      </p>

      <b>Reasons</b>

      <ul>
        ${(data.reasons || [])
          .map(reason => `<li>${reason}</li>`)
          .join("")}
      </ul>

      <p class="muted">
        ${data.disclaimer ||
        "Technical analysis is probabilistic. No signal is guaranteed."}
      </p>

    `;

  } catch (error) {

    console.error(error);

    status.textContent =
      "Connection failed. Check Vercel deployment and API.";

  }

});


function resizeImage(file) {

  return new Promise((resolve, reject) => {

    const img = new Image();

    const url = URL.createObjectURL(file);

    img.onload = () => {

      const maxWidth = 1200;

      const scale =
        Math.min(1, maxWidth / img.width);

      const canvas = document.createElement("canvas");

      canvas.width =
        Math.round(img.width * scale);

      canvas.height =
        Math.round(img.height * scale);

      const ctx = canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      URL.revokeObjectURL(url);

      resolve(
        canvas.toDataURL("image/jpeg", 0.70)
      );

    };

    img.onerror = reject;

    img.src = url;

  });

}

</script>

</body>
</html>
