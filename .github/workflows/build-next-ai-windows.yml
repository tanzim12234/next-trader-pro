name: Build NEXT AI Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "next-ai-desktop/**"
      - ".github/workflows/build-next-ai-windows.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: next-ai-desktop
    env:
      # Configure these GitHub Actions secrets after obtaining a trusted
      # Windows code-signing certificate (.pfx/.p12).
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Report signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Warning "No code-signing certificate configured. This build will be unsigned and Smart App Control may block it."
          } else {
            Write-Host "Code-signing certificate is configured; electron-builder will sign the installer."
          }
      - name: Build NSIS installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXT-AI-Windows-Installer
          path: next-ai-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
