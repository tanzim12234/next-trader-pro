name: NEXT AI Desktop Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/windows/**"
      - ".github/workflows/next-ai-builds.yml"

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/android/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install
      - name: Generate native Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: next-ai-android-debug-apk
          path: apps/android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Build Windows EXE Installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/windows/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: next-ai-windows-installer
          path: apps/windows/dist/*.exe
          if-no-files-found: error
          retention-days: 14
