name: Build NEXT AI Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "next-ai-desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      NEXT_AI_UPDATE_PUBLIC_KEY: ${{ secrets.NEXT_AI_UPDATE_PUBLIC_KEY }}
      NEXT_AI_UPDATE_PRIVATE_KEY: ${{ secrets.NEXT_AI_UPDATE_PRIVATE_KEY }}
    defaults:
      run:
        working-directory: next-ai-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main.cjs
          node --check src/preload.cjs
          node --check src/brain.cjs
          node --check src/renderer.js
          node --check src/skill-manager.cjs
          node --check src/code-lab.cjs
          node --check src/system-monitor.cjs
          node --check src/self-healing.cjs
          node --check src/repair-engine.cjs
          node --check src/update-manager.cjs
          node --check scripts/sign-update-manifest.cjs
          node --check test/repair-update.test.cjs
          node --check src/command-router.cjs
          node --check test/semantic-runtime-smoke.cjs
      - name: Test Personal Brain
        run: npm test
      - name: Test local semantic model and fallback on Windows
        run: node test/semantic-runtime-smoke.cjs
        timeout-minutes: 20
      - name: Configure signed update verification key
        if: ${{ env.NEXT_AI_UPDATE_PUBLIC_KEY != '' }}
        shell: pwsh
        env:
        run: |
          Set-Content -Path src/update-public-key.pem -Value $env:NEXT_AI_UPDATE_PUBLIC_KEY -NoNewline
      - name: Report signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Write-Warning "No code-signing certificate configured. The installer will be unsigned."
          } else {
            Write-Host "Code-signing certificate configured."
          }
      - name: Build Windows x64 installer
        run: npm run dist
      - name: Create signed update manifest
        if: ${{ env.NEXT_AI_UPDATE_PRIVATE_KEY != '' && env.NEXT_AI_UPDATE_PUBLIC_KEY != '' }}
        env:
        run: node scripts/sign-update-manifest.cjs
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXT-AI-Windows-x64
          path: |\n            next-ai-desktop/release/*.exe\n            next-ai-desktop/release/update-manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish public GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-ai-desktop-v0.1.0
          name: NEXT AI Desktop v0.1.0
          draft: false
          prerelease: false
          make_latest: true
          files: |\n            next-ai-desktop/release/*.exe\n            next-ai-desktop/release/update-manifest.json
          fail_on_unmatched_files: false
