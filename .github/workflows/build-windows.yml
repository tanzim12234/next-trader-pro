name: Build NEXT AI Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - "next-ai-desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: next-ai-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check src/main.cjs
          node --check src/preload.cjs
          node --check src/brain.cjs
      - name: Build Windows x64 installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXT-AI-Windows-x64
          path: next-ai-desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
