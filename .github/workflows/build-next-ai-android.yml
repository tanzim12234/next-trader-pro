name: Build NEXT AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "next-ai-android/**"
      - ".github/workflows/build-next-ai-android.yml"

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-ai-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Build web assets and Keystore plugin
        run: npm run build
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-ai-android-${{ github.run_number }}
          name: NEXT AI Android APK (build ${{ github.run_number }})
          files: next-ai-android/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
